ls:
  .dir: kebab-case

  scripts:
    .ts: kebab-case

  spec:
    .dir: kebab-case
    .md: kebab-case | regex:^README$
    .json: kebab-case

  schema:
    .dir: kebab-case
    .json: kebab-case

  # A message file is named for the message identity it defines, which the
  # schema requires to be PascalCase. The validator checks that they match.
  schema/messages:
    .json: PascalCase

  schema/types:
    .json: PascalCase

  styles:
    .dir: kebab-case

  styles/trueshot:
    .yml: kebab-case

  conformance:
    .md: kebab-case | regex:^README$

  conformance/vectors:
    .dir: kebab-case
    .json: kebab-case

  conformance/live:
    .dir: kebab-case
    .ts: kebab-case
    .json: kebab-case

ignore:
  - .git
  - .github
  - .githooks
  - dist
  - node_modules
  - conformance/live/node_modules
  - conformance/live/captures
  - conformance/live/native/build
