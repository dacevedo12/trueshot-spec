name: commits

on: pull_request

permissions:
  contents: read

jobs:
  commits:
    name: messages and sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: conventional commit messages
        run: >
          npx --no-install commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
      - name: sign-off present on every commit
        run: |
          set -euo pipefail
          missing=0
          range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          count=$(git rev-list --count "$range")
          if [ "$count" -eq 0 ]; then
            echo "no commits in $range, so nothing was checked" >&2
            exit 1
          fi
          for sha in $(git rev-list "$range"); do
            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: '; then
              echo "no sign-off: $sha $(git log -1 --format=%s "$sha")"
              missing=1
            fi
          done
          exit $missing
