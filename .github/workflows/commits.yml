name: commits

on: pull_request

permissions:
  contents: read

jobs:
  commits:
    name: messages and sign-off
    runs-on: ubuntu-latest
    env:
      RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: the range holds commits
        run: |
          set -euo pipefail
          count=$(git rev-list --count "$RANGE")
          if [ "$count" -eq 0 ]; then
            echo "no commits in $RANGE, so the checks below would pass unread" >&2
            exit 1
          fi
          echo "$count commit(s) to check"
      - name: conventional commit messages
        run: >
          npx --no-install commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
      - name: sign-off present on every commit
        run: |
          set -euo pipefail
          missing=0
          for sha in $(git rev-list "$RANGE"); do
            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: '; then
              echo "no sign-off: $sha $(git log -1 --format=%s "$sha")"
              missing=1
            fi
          done
          exit $missing
