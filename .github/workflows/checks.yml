name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: every check, and the books
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@v23
      # The tools come from flake.lock, so CI runs what a local
      # `nix develop` runs.
      - run: nix develop -c bun install --frozen-lockfile
      - run: nix develop -c bun run check
      - run: nix develop -c bun run books
      # Every link in the built books resolves, anchors included.
      - run: nix develop -c lychee --offline --no-progress --include-fragments --exclude-path '404\.html$' 'dist/site/**/*.html'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  # The books are what this repository makes, so every push to main that
  # passes its checks publishes them.
  publish:
    name: publish the books
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
