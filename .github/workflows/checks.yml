name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: every check, and the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@v23
      # The tools come from flake.lock, so CI runs what a local
      # `nix develop` runs.
      - run: nix develop -c bun install --frozen-lockfile
      - run: nix develop -c bun run check
      - run: nix develop -c bun run site -- --pdf
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/site
