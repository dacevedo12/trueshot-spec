name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: every check, and the books
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@v23
      # The tools come from flake.lock, so CI runs what a local
      # `nix develop` runs.
      - run: nix develop -c bun install --frozen-lockfile
      - run: nix develop -c bun run check
      - run: nix develop -c bun run site
      - run: nix develop -c bun run pages
      # Every link in the built books resolves, anchors included.
      - run: nix develop -c lychee --offline --no-progress --include-fragments --exclude-path '404\.html$' 'dist/pages/**/*.html'
      - uses: actions/upload-artifact@v7
        with:
          name: pages
          path: dist/pages
